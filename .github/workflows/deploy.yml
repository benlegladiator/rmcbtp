name: Deploiement Automatique vers Hostinger (rmcbtpsarl.com)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Sync SFTP to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Recuperation du code
        uses: actions/checkout@v4

      - name: 🚀 Synchronisation SFTP vers Hostinger Production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_HOST || '147.93.42.200' }}
          username: ${{ secrets.HOSTINGER_USER || 'u864783662' }}
          password: ${{ secrets.HOSTINGER_PASSWORD || secrets.FTP_PASSWORD }}
          port: 65002
          protocol: sftp
          server-dir: /home/u864783662/domains/rmcbtpsarl.com/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            README.md
            *.sql
            scratch/**
